name: Keep demos awake

# Free hosting plans (e.g. Render) sleep after ~15 minutes without traffic.
# This visits every URL in urls.txt every 10 minutes from 10:00 AM to 11:50 PM India time (IST),
# and lets demos sleep from about midnight to 10 AM to save free-plan hours.
# GitHub cron is in UTC (IST = UTC + 5:30). Scheduled runs can start a few minutes late.
on:
  schedule:
    - cron: "30,40,50 4 * * *" # 10:00-10:20 AM IST
    - cron: "*/10 5-17 * * *" # 10:30 AM-11:20 PM IST
    - cron: "0,10,20 18 * * *" # 11:30-11:50 PM IST
  workflow_dispatch:
  push:
    paths: [urls.txt]

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Ping every URL in urls.txt
        run: bash ping.sh urls.txt
