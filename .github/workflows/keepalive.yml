name: Keep demos awake

# Free hosting plans (e.g. Render) sleep after ~15 minutes without traffic.
# Runs every 10 minutes, day and night; ping.sh decides per URL whether to ping now:
#   - plain line            -> daily, 10:00 AM-11:59 PM India time (IST)
#   - line with until=...   -> demo window: around the clock until that IST time, then never
# Scheduled runs can start a few minutes late, hence 10 minutes (Render sleeps after 15).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    paths: [urls.txt, ping.sh]

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Ping URLs that are due
        run: bash ping.sh urls.txt
